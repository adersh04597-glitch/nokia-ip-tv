i<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, height=320, initial-scale=1.0, user-scalable=no">
    <title>Nokia IPTV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            font-size: 11px;
        }

        body {
            width: 240px;
            height: 320px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 25px;
            background-color: #111;
            color: #00d2ff;
            text-align: center;
            line-height: 25px;
            font-weight: bold;
            border-bottom: 1px solid #222;
        }

        .channel-list {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #050505;
        }

        .channel-item {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 8px 6px;
            border: none;
            border-bottom: 1px solid #1a1a1a;
            background: #0f0f0f;
            color: #ccc;
            text-align: left;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .channel-icon {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .channel-item:focus, .channel-item:active {
            background-color: #0055ff;
            color: #ffffff;
            font-weight: bold;
            outline: none;
        }

        .player-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 320px;
            background: #000;
            z-index: 9999;
            outline: none;
        }

        .player-overlay.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 240px;
            height: 320px;
            object-fit: contain;
            background-color: #000;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">📺 IPTV Channels</div>
    <div class="channel-list" id="channelContainer"></div>

    <div class="player-overlay" id="playerOverlay" tabindex="0">
        <video id="videoPlayer" autoplay playsinline></video>
    </div>

    <script>
        const embeddedM3U = `
#EXTM3U
#EXTINF:-1 tvg-name="Sample 1" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/kappa-tv-in.png", Kappa TV
https://cdn-3.pishow.tv/live/1123/master.m3u8
#EXTINF:-1 tvg-name="Sample 2" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/dd-sports-in.png", DD Sports
https://d3qs3d2rkhfqrt.cloudfront.net/out/v1/b17adfe543354fdd8d189b110617cddd/index.m3u8
#EXTINF:-1 tvg-name="Sample 2" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/mazhavil-manorama-in.png", Mazhavi Manorama HD
https://cdn-7.pishow.tv/live/1129/master.m3u8  
#EXTINF:-1 tvg-name="Sample 2" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/kairali-we-in.png", Kairali WE
https://cdn-3.pishow.tv/live/1530/master.m3u8
#EXTINF:-1 tvg-name="Sample 2" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/dd-national-in.png", DD National
https://cdn-1.pishow.tv/live/11/master.m3u8
#EXTINF:-1 tvg-name="Sample 2" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/asianet-news-in.png", Asianet News
https://asianetnews.vgcdn.net/vglive-sk-917600/playlist.m3u8
`;

        const videoPlayer = document.getElementById('videoPlayer');
        const playerOverlay = document.getElementById('playerOverlay');
        const channelContainer = document.getElementById('channelContainer');

        let parsedChannels = [];
        let currentChannelIndex = 0;

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentName = '';
            let currentLogo = '';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    currentLogo = logoMatch ? logoMatch[1] : '';

                    const commaIndex = line.lastIndexOf(',');
                    currentName = (commaIndex !== -1) ? line.substring(commaIndex + 1).trim() : 'Channel ' + (channels.length + 1);
                } else if (line.length > 0 && !line.startsWith('#')) {
                    channels.push({
                        name: currentName || 'Channel ' + (channels.length + 1),
                        logo: currentLogo,
                        url: line
                    });
                    currentName = '';
                    currentLogo = '';
                }
            }
            return channels;
        }

        function renderPlaylist(channels) {
            channelContainer.innerHTML = '';
            channels.forEach((channel, index) => {
                const btn = document.createElement('button');
                btn.className = 'channel-item';
                btn.tabIndex = index + 1;

                const imgHtml = channel.logo ? `<img class="channel-icon" src="${channel.logo}" onerror="this.style.display='none'">` : '';
                btn.innerHTML = `${imgHtml}<span>${index + 1}. ${channel.name}</span>`;

                btn.onclick = function() {
                    playChannel(index);
                };

                channelContainer.appendChild(btn);
            });

            const firstItem = channelContainer.querySelector('.channel-item');
            if (firstItem) firstItem.focus();
        }

        function playChannel(index) {
            if (index < 0 || index >= parsedChannels.length) return;

            currentChannelIndex = index;
            const channel = parsedChannels[currentChannelIndex];

            playerOverlay.classList.add('active');
            playerOverlay.focus(); // Force keyboard focus onto overlay container

            videoPlayer.src = channel.url;
            videoPlayer.load();
            videoPlayer.play().catch(e => console.log(e));
        }

        function playNextChannel() {
            let nextIndex = currentChannelIndex + 1;
            if (nextIndex >= parsedChannels.length) nextIndex = 0;
            playChannel(nextIndex);
        }

        function playPrevChannel() {
            let prevIndex = currentChannelIndex - 1;
            if (prevIndex < 0) prevIndex = parsedChannels.length - 1;
            playChannel(prevIndex);
        }

        function closePlayer() {
            videoPlayer.pause();
            videoPlayer.src = "";
            playerOverlay.classList.remove('active');

            // Refocus current channel button in list
            const currentBtn = channelContainer.children[currentChannelIndex];
            if (currentBtn) currentBtn.focus();
        }

        // Keyboard handler supporting D-Pad + Number Keypad
        window.addEventListener('keydown', function(e) {
            if (!playerOverlay.classList.contains('active')) return;

            const key = e.key;
            const code = e.keyCode;

            // RIGHT ARROW OR KEY '6' -> NEXT CHANNEL
            if (key === "ArrowRight" || code === 39 || key === "6" || code === 54) {
                playNextChannel();
                e.preventDefault();
            }
            // LEFT ARROW OR KEY '4' -> PREVIOUS CHANNEL
            else if (key === "ArrowLeft" || code === 37 || key === "4" || code === 52) {
                playPrevChannel();
                e.preventDefault();
            }
            // OK / CENTER / ENTER OR KEY '5' -> PLAY/PAUSE
            else if (key === "Enter" || code === 13 || key === "5" || code === 53) {
                if (videoPlayer.paused) {
                    videoPlayer.play();
                } else {
                    videoPlayer.pause();
                }
                e.preventDefault();
            }
            // BACKSPACE / ESCAPE OR KEY '0' -> EXIT
            else if (key === "Backspace" || key === "Escape" || code === 8 || key === "0" || code === 48) {
                closePlayer();
                e.preventDefault();
            }
        }, true);

        parsedChannels = parseM3U(embeddedM3U);
        renderPlaylist(parsedChannels);
    </script>
</body>
</html>
