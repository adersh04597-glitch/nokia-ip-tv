<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia IPTV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            font-size: 11px;
        }

        html, body {
            width: 240px;
            height: 320px;
            overflow: hidden;
            position: relative;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 25px;
            background-color: #111;
            color: #00d2ff;
            text-align: center;
            line-height: 25px;
            font-weight: bold;
            border-bottom: 1px solid #222;
        }

        .channel-list {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #050505;
        }

        .channel-item {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 8px 6px;
            border: none;
            border-bottom: 1px solid #1a1a1a;
            background: #0f0f0f;
            color: #ccc;
            text-align: left;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .channel-icon {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .channel-item:focus, .channel-item:active {
            background-color: #0055ff;
            color: #ffffff;
            font-weight: bold;
            outline: none;
        }

        .player-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 240px;
            height: 320px;
            background: #000;
            z-index: 99999;
        }

        .player-overlay.active {
            display: block;
        }

        video {
            width: 240px;
            height: 320px;
            object-fit: contain;
            background-color: #000;
        }
    </style>
</head>
<body>

    <div class="header">📺 IPTV Channels</div>
    <div class="channel-list" id="channelContainer"></div>

    <div class="player-overlay" id="playerOverlay">
        <video id="videoPlayer" playsinline webkit-playsinline autoplay controls></video>
    </div>

    <script>
        const embeddedM3U = `

#EXTM3U
#EXTINF:-1 tvg-name="Asianet News" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/asianet-news-in.png", Asianet News
https://asianetnews.vgcdn.net/vglive-sk-917600/playlist.m3u8
#EXTINF:-1 tvg-name="DD Malayalam" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/dd-malayalam-in.png", DD Malayalam
https://d3qs3d2rkhfqrt.cloudfront.net/out/v1/fa9723fb88f844fa800bb34e1cb5bfbd/index.m3u8
#EXTINF:-1 tvg-name="DD National" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/dd-national-in.png", DD National
https://mumt01.tangotv.in/O5aw8Zn3DDNATIONALHD/index.m3u8
#EXTINF:-1 tvg-name="DD Sports" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/dd-sports-in.png", DD Sports
https://d3qs3d2rkhfqrt.cloudfront.net/out/v1/b17adfe543354fdd8d189b110617cddd/index.m3u8
#EXTINF:-1 tvg-name="Flowers TV USA" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/flowers-tv-in.png", Flowers TV USA
https://yuppmedtaorire.akamaized.net/v1/master/a0d007312bfd99c47f76b77ae26b1ccdaae76cb1/flowers_nim_https/050522/flowers/playlist.m3u8
#EXTINF:-1 tvg-name="Kairali WE" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/kairali-we-in.png", Kairali WE
https://cdn-3.pishow.tv/live/1530/master.m3u8
#EXTINF:-1 tvg-name="Kappa TV" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/kappa-tv-in.png", Kappa TV
https://cdn-3.pishow.tv/live/1123/master.m3u8
#EXTINF:-1 tvg-name="Mazhavil Manorama HD" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/mazhavil-manorama-in.png", Mazhavil Manorama HD
https://cdn-7.pishow.tv/live/1129/master.m3u8
#EXTINF:-1 tvg-name="Media One" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/media-one-in.png", Media One
https://d138pvw5w7xed7.cloudfront.net/out/v1/93b22b6dfdbe4e47be94e7dfeb30aaae/index.m3u8
#EXTINF:-1 tvg-name="Reporter TV" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/reporter-tv-in.png", Reporter TV
https://cdn-1.pishow.tv/live/1587/master.m3u8
#EXTINF:-1 tvg-name="Safari TV" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/safari-tv-in.png", Safari TV
https://j78dp346yq5r-hls-live.5centscdn.com/safari/live.stream/playlist.m3u8
#EXTINF:-1 tvg-name="Sansad TV 2" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/sansad-tv-2-in.png", Sansad TV 2
https://d2lk5u59tns74c.cloudfront.net/out/v1/e4182054dce340da9e0ff38b6b3658a4/index.m3u8
#EXTINF:-1 tvg-name="Twenty Four" tvg-logo="https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/india/24-news-in.png", Twenty Four (24 News)
https://cdn-3.pishow.tv/live/1124/master.m3u8

`;

        const videoPlayer = document.getElementById('videoPlayer');
        const playerOverlay = document.getElementById('playerOverlay');
        const channelContainer = document.getElementById('channelContainer');

        let parsedChannels = [];
        let currentChannelIndex = 0;

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentName = '';
            let currentLogo = '';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    currentLogo = logoMatch ? logoMatch[1] : '';

                    const commaIndex = line.lastIndexOf(',');
                    currentName = (commaIndex !== -1) ? line.substring(commaIndex + 1).trim() : 'Channel ' + (channels.length + 1);
                } else if (line.length > 0 && !line.startsWith('#')) {
                    channels.push({
                        name: currentName || 'Channel ' + (channels.length + 1),
                        logo: currentLogo,
                        url: line
                    });
                    currentName = '';
                    currentLogo = '';
                }
            }
            return channels;
        }

        function renderPlaylist(channels) {
            channelContainer.innerHTML = '';
            channels.forEach((channel, index) => {
                const btn = document.createElement('button');
                btn.className = 'channel-item';
                btn.tabIndex = index + 1;

                const imgHtml = channel.logo ? `<img class="channel-icon" src="${channel.logo}" onerror="this.style.display='none'">` : '';
                btn.innerHTML = `${imgHtml}<span>${index + 1}. ${channel.name}</span>`;

                btn.onclick = function() {
                    playChannel(index);
                };

                channelContainer.appendChild(btn);
            });

            const firstItem = channelContainer.querySelector('.channel-item');
            if (firstItem) firstItem.focus();
        }

        function playChannel(index) {
            if (index < 0 || index >= parsedChannels.length) return;

            currentChannelIndex = index;
            const channel = parsedChannels[currentChannelIndex];

            // Add history state so native phone back key works out-of-the-box
            history.pushState({ playing: true }, "");

            playerOverlay.classList.add('active');

            videoPlayer.src = channel.url;
            videoPlayer.load();
            videoPlayer.play().catch(e => console.log(e));
        }

        function closePlayer() {
            videoPlayer.pause();
            videoPlayer.src = "";
            playerOverlay.classList.remove('active');

            const currentBtn = channelContainer.children[currentChannelIndex];
            if (currentBtn) currentBtn.focus();
        }

        // Handle native back key navigation (History API)
        window.addEventListener('popstate', function() {
            if (playerOverlay.classList.contains('active')) {
                closePlayer();
            }
        });

        // Global key fallback for Nokia Back/Clear keycodes
        window.addEventListener('keydown', function(e) {
            if (!playerOverlay.classList.contains('active')) return;

            // KeyCodes covering Nokia Backspace, Escape, softkey back (8, 27, 461, 10009)
            if (e.key === "Backspace" || e.key === "Escape" || e.keyCode === 8 || e.keyCode === 27 || e.keyCode === 461 || e.keyCode === 10009) {
                if (history.state && history.state.playing) {
                    history.back();
                } else {
                    closePlayer();
                }
                e.preventDefault();
            }
        }, true);

        parsedChannels = parseM3U(embeddedM3U);
        renderPlaylist(parsedChannels);
    </script>
</body>
</html>
